<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Waygate 品牌标记（favicon）—— 与 web/src/components/BrandMark.tsx 同形。
       浅色瓦片（2026-10-14 用户两轮反馈底色过深后定稿）：底取产品浅色主题的
       页面色（theme.css 的 bg 前缀自属性一族），细描边勾出瓦片轮廓（白标签栏上不糊）；
       品牌渐变同步**加深**（浅底上原渐变的青端对比只有 1.4:1 会隐形，
       加深后三停为 5.5 / 4.3 / 2.5，16px 下仍清晰）。

       ⚠️ 本文件是**严格 XML**（浏览器把 SVG 当图片时不容错）：注释里**绝不能**出现
       连续双连字符（XML 规范禁止），写 CSS 变量名时要拆开（如 brand 前的两个连字符
       要分开写），否则整份文档解析失败 —— 表现为标签栏图标静默不显示。
       2026-10-14 就是踩了这个：注释里写了完整的 CSS 自定义属性名。 -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="7" fill="#EDEAF8" stroke="#C9C2EC" stroke-width="1"/>
  <defs>
    <linearGradient id="wg" x1="0" y1="32" x2="32" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B3FE0"/>
      <stop offset=".5" stop-color="#3B66E0"/>
      <stop offset="1" stop-color="#0FA3C9"/>
    </linearGradient>
  </defs>
  <path d="M4.5 27L14.9 16.6" stroke="url(#wg)" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="18.5" cy="14.5" r="5.4" fill="url(#wg)"/>
  <path d="M21.8 11.2L27.9 5.1" stroke="url(#wg)" stroke-width="4.6" stroke-linecap="round"/>
  <path d="M22.1 17.9H28.1" stroke="url(#wg)" stroke-width="4.6" stroke-linecap="round"/>
</svg>
