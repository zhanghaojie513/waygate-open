# 驿站 · Relay —— 8443 + 自签 TLS
#
# 为什么是 8443 而不是 443：没有域名，Let's Encrypt 签不了证；用 8443 是为了
# 与"标准 HTTPS"区分开，提醒使用者这是自签证书。443 保留未用。
#
# ⚠️ 三处关键配置，改动前请读注释：
#   1) proxy_set_header Host $http_host —— 必须原样转发浏览器的 Host 头（**含端口**）。
#      后端对写方法做 CSRF 同源校验（Origin 必须等于 Host）。
#
#      ★ 这里必须是 $http_host，不能是 $host：$host **不含端口**。
#        实测踩坑记录：最初写成 `$host`，于是浏览器发
#        `Origin: https://relay.example.com:8443`，后端收到的 Host 却是
#        `relay.example.com`（端口被 $host 吃掉了），两者不等 →
#        **所有写操作 403 40301，连控制台登录都进不去**。
#        因为服务跑在非标准端口 8443，这个错误必然触发，不是偶发。
#        $http_host = 原始 Host 头，端口保留，校验才成立。
#        另有佐证：把 Origin 的端口去掉（`Origin: https://relay.example.com`）
#        就能过校验并正常走到 401（会话检查），说明问题确实只在端口。
#
#      若改成 $proxy_host，或写死 Host 127.0.0.1:8787，同样会 40301。
#   2) proxy_buffering off + X-Accel-Buffering: no —— SSE 必需。
#      缺了它们，Nginx 会把流式响应缓冲成一整块，"逐字输出"变成
#      "等半天一次性吐出"，而且首字延迟看起来像超时。
#   3) proxy_read_timeout 300s —— 长回答不能中途被掐。
#   4) X-Forwarded-For 用 $remote_addr（**覆写**），不用 $proxy_add_x_forwarded_for（追加）。
#      ★ 实测踩坑记录：最初用 $proxy_add_x_forwarded_for，它是**追加**语义 ——
#        客户端发 `X-Forwarded-For: 1.2.3.4`，Nginx 转发成 `1.2.3.4, <真实IP>`，
#        于是"第一个"是攻击者自己填的。后端若取首段就会：
#          - 审计日志记下伪造 IP（追责失效）
#          - 限流桶被随意切换（每次请求换个假 IP 就能绕过锁定）
#        实测确认：带 `X-Forwarded-For: 1.2.3.4` 打进来，日志确实记成了 1.2.3.4。
#        因为当前部署**只有 Nginx 一层代理**，不存在需要保留的上游链路，
#        所以这里直接覆写成 $remote_addr（真实 TCP 对端），从源头杜绝伪造。
#        若将来前面加了 CDN/LB，需改回追加语义，并让后端用"从右往左跳过可信代理"的算法。

server {
    # 注意：Ubuntu 22.04 自带 nginx 1.18，**不支持**独立的 `http2 on;` 指令
    # （那是 1.25.1+ 的写法），只能把 http2 写在 listen 行尾。
    # 写错的话 `nginx -t` 会报 unknown directive "http2"。
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;

    server_name relay.example.com;

    ssl_certificate     /etc/relay/tls/server.crt;
    ssl_certificate_key /etc/relay/tls/server.key;

    # 自签场景下的合理配置：TLS 1.2+，不追求最高兼容
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:RelayTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 这个站只服务本产品，禁止被嵌进 iframe
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # gzip 对 JSON 明细表与打包后的 JS/CSS 收益明显。
    # comp_level 显式设 5：nginx 默认是 1，对 400K+ 的 JS chunk 压缩比明显吃亏；
    # 5 是"CPU 代价可忽略、体积接近平台期"的常用档（6+ 每级体积收益骤减）。
    # gzip_vary 让中间缓存按 Accept-Encoding 分桶，避免把 gzip 响应发给不支持的客户端。
    gzip on;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # ---------- 控制台静态文件 ----------
    root /opt/relay/web/dist;
    index index.html;

    # 前端是 hash 路由（#/settings），静态资源找不到就回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带指纹的资源长缓存；index.html 绝不缓存（否则发版后用户拿到旧壳）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # ---------- API 反代 ----------
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;                 # ★ 见文件头说明 1)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;         # ★ 见文件头说明 4)
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;                         # ★ 见文件头说明 2)
        proxy_set_header X-Accel-Buffering no;
    }

    # ---------- OpenAI 兼容端点（SSE 流式，最关键的一段） ----------
    location /v1/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;         # ★ 见文件头说明 4)
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 三件套：不缓冲 + 不超时 + 不压缩
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;
        chunked_transfer_encoding on;

        # 长回答要能一直流下去
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 15s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $http_host;
        access_log off;
    }

    # 隐藏文件一律拒绝（.env / .git 之类）
    location ~ /\. {
        deny all;
    }
}
